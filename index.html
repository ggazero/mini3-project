<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방탈출 테마 비교 도우미</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;          /* 조건 · 근거처럼 한 덩어리로 묶는 영역 */
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5f6670;
      --line: #e4e7eb;
      --line-strong: #cfd4da;
      --accent: #2f5bd3;
      --primary: #2f5bd3;
      --primary-hover: #2449ad;
      --primary-soft: #eef2fc;
      --hover-bg: #f1f4fb;
      --selected: #2b3445;
      --selected-hover: #1c2230;
      --field-bg: #ffffff;
      --field-line: #cfd6e3;
      --focus-ring: rgba(47, 91, 211, 0.28);
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      --notice-bg: #fff8e6;        /* 후보 없음 · 다시 눌러 주세요 */
      --notice-line: #f0d48a;
      --notice-text: #6b4e00;
      --danger-bg: #fdecec;        /* 예산 오류 · 불러오기 오류 */
      --danger-line: #f1b5b5;
      --danger-text: #a4262c;
      --radius: 12px;
      --radius-sm: 8px;
      --gap: 24px;                 /* 영역 사이 간격 */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131416;
        --surface: #1b1d20;
        --card: #202226;
        --text: #eceef0;
        --muted: #a3a9b1;
        --line: #30333a;
        --line-strong: #454a52;
        --accent: #8aa9ff;
        --primary: #3d63d6;
        --primary-hover: #4d72e3;
        --primary-soft: #1f2a44;
        --hover-bg: #262c38;
        --selected: #5b6b8c;
        --selected-hover: #6b7ca0;
        --field-bg: #16181b;
        --field-line: #3a4252;
        --focus-ring: rgba(138, 169, 255, 0.38);
        --shadow: none;
        --notice-bg: #2b2413;
        --notice-line: #5c4a1a;
        --notice-text: #f1d58a;
        --danger-bg: #2e1a1b;
        --danger-line: #6a2e31;
        --danger-text: #ff9c9c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 40px 16px 56px; }

    /* 상단 제목 */
    .page-head { margin: 0 0 var(--gap); }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.02em; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); line-height: 1.25; letter-spacing: -0.01em; }
    .lead { margin: 0; max-width: 560px; color: var(--muted); }

    /* 공통 영역(패널) */
    .panel {
      margin: 0 0 var(--gap);
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .panel-title { margin: 0 0 10px; font-size: 1rem; font-weight: 700; }

    /* 버튼 공통 */
    button { font: inherit; }
    .filter button, .recommend button, .sort button {
      min-height: 40px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
    }
    .filter button:focus-visible, .recommend button:focus-visible, .sort button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* 조건 입력: 칸 두 개 + [적용](보조 단추) */
    .filter {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 200px)) auto;
      justify-content: start;
      align-items: end;
      gap: 12px;
    }
    .filter label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field-label { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .filter input {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 8px 12px;
      font: inherit;
      color: var(--text);
      background: var(--field-bg);
      border: 1px solid var(--field-line);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .filter input:hover { border-color: var(--accent); }
    .filter input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .filter button {
      color: var(--primary);
      background: var(--card);
      border: 1px solid var(--line-strong);
      font-weight: 600;
    }
    .filter button:hover { border-color: var(--primary); background: var(--hover-bg); }

    /* AI 추천: 주 단추 + 결과 카드 */
    .recommend { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .recommend button {
      color: #ffffff;
      background: var(--primary);
      border: 1px solid var(--primary);
      font-weight: 700;
    }
    .recommend button:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
    .recommend button:disabled { opacity: 0.65; cursor: wait; }
    #recommend-result {
      margin-top: 14px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }
    #recommend-result:has(.pick-name)::before {
      content: "AI 추천";
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }
    #recommend-result p { margin: 0; }
    #recommend-result .pick-name { margin-bottom: 8px; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
    #recommend-result .pick-name ~ p { position: relative; padding-left: 14px; color: var(--muted); }
    #recommend-result .pick-name ~ p::before { content: "·"; position: absolute; left: 2px; font-weight: 700; }
    /* 추천 대신 안내만 뜬 경우 (잠시 뒤 다시 · 확인하지 못함) */
    #recommend-result:not(:has(.pick-name)) {
      color: var(--notice-text);
      background: var(--notice-bg);
      border-color: var(--notice-line);
      border-left-color: var(--notice-line);
      box-shadow: none;
    }

    /* 안내 문구 */
    #budget-error, #error, #empty {
      margin: 12px 0 0;
      padding: 12px 16px;
      border: 1px solid;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    #budget-error, #error { color: var(--danger-text); background: var(--danger-bg); border-color: var(--danger-line); }
    #empty { margin: 0; color: var(--notice-text); background: var(--notice-bg); border-color: var(--notice-line); font-weight: 500; }
    [hidden] { display: none !important; }

    /* 결과 머리줄: 개수 + 정렬 */
    .results-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 16px;
    }
    #count { margin: 0; font-weight: 700; }
    .sort { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .sort button {
      min-height: 36px;
      padding: 6px 12px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line-strong);
      font-size: 0.92rem;
    }
    .sort button:hover { border-color: var(--accent); background: var(--hover-bg); }
    .sort button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--selected);
      border-color: var(--selected);
      font-weight: 600;
    }
    .sort button[aria-pressed="true"]::before { content: "✓ "; }
    .sort button[aria-pressed="true"]:hover { background: var(--selected-hover); border-color: var(--selected-hover); }
    .sort-state { margin-left: 4px; color: var(--muted); font-size: 0.78rem; opacity: 0.85; }

    /* 테마 카드 */
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 4px; font-size: 1.02rem; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
    .meta { margin: 0; color: var(--muted); font-size: 0.93rem; font-variant-numeric: tabular-nums; }
    .card a {
      margin-top: auto;
      padding-top: 12px;
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      border-top: 1px solid var(--line);
    }
    .card a::after { content: " ↗"; }
    .card a:hover { text-decoration: underline; }
    .card a:focus-visible { outline: none; border-radius: 4px; box-shadow: 0 0 0 3px var(--focus-ring); }
    .card.is-pick { border: 2px solid var(--primary); padding: 17px; background: var(--primary-soft); }
    .pick-badge {
      align-self: flex-start;
      margin-bottom: 2px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--primary);
      border-radius: 999px;
    }

    /* 근거 영역 */
    .evidence { margin: 48px 0 0; padding: 24px 20px; }
    .evidence h2 { margin: 0 0 16px; font-size: 1.15rem; }
    .evidence figure { margin: 0 0 28px; }
    .evidence img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      background: #ffffff; /* 그림 배경이 흰색이라 어두운 화면에서도 흰 바탕 위에 둔다 */
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .evidence figcaption { margin-top: 10px; max-width: 900px; }
    .evidence-notes { margin: 0; max-width: 900px; }
    .evidence-notes dt { font-weight: 700; }
    .evidence-notes dd { margin: 2px 0 12px; color: var(--muted); }

    /* 휴대폰: 칸과 단추를 한 줄씩 꽉 차게 */
    @media (max-width: 600px) {
      main { padding: 28px 16px 40px; }
      .panel { padding: 16px; }
      .filter { grid-template-columns: minmax(0, 1fr); }
      .filter button, .recommend button { width: 100%; }
      .results-head { align-items: flex-start; flex-direction: column; }
      #list { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-head">
      <p class="eyebrow">방도장 공개 목록 기반</p>
      <h1>방탈출 테마 비교 도우미</h1>
      <p class="lead">예산과 난이도로 테마를 거르고, 후보 중 하나를 AI에게 추천받아 보세요.</p>
    </header>

    <section class="panel conditions" aria-labelledby="conditions-title">
      <h2 class="panel-title" id="conditions-title">조건</h2>
      <div class="filter">
        <label><span class="field-label">최대 예산(원)</span><input type="number" id="max-price" min="0" step="1000"></label>
        <label><span class="field-label">최소 난이도</span><input type="number" id="min-difficulty" min="0" step="0.1"></label>
        <button type="button" id="apply">적용</button>
      </div>
      <p id="budget-error" role="alert" hidden>예산은 0보다 커야 합니다</p>
      <div class="recommend">
        <button type="button" id="recommend-btn">이 조건으로 추천받기</button>
        <div id="recommend-result" aria-live="polite" hidden></div>
      </div>
    </section>

    <div class="results-head">
      <p id="count">불러오는 중…</p>
      <div class="sort" role="group" aria-label="가격 정렬">
        <button type="button" id="sort-asc" aria-pressed="false">가격 낮은 순</button>
        <button type="button" id="sort-desc" aria-pressed="false">가격 높은 순</button>
        <span class="sort-state" id="sort-state">지금: data.json 순서</span>
      </div>
    </div>
    <ul id="list"></ul>
    <p id="empty" hidden></p>
    <p id="error" hidden></p>

    <section class="panel evidence" aria-labelledby="evidence-title">
      <h2 id="evidence-title">근거</h2>

      <figure>
        <img src="charts/hist.png" width="1200" height="750" loading="lazy"
             alt="가격 분포 히스토그램 (n = 28). 25,000~27,000원 2개, 27,000~29,000원 8개, 29,000~31,000원 6개, 31,000~33,000원 4개, 33,000~35,000원 8개.">
        <figcaption>
          <strong>그림 1 관찰:</strong>
          27,000~29,000원과 33,000~35,000원 구간이 각각 8개로 공동 최다였다.
        </figcaption>
      </figure>

      <figure>
        <img src="charts/by_category.png" width="1800" height="900" loading="lazy"
             alt="난이도별 평균 가격 막대그래프 (n = 28). 가로축은 difficulty 1.7부터 4.1까지, 세로축은 평균 가격(원).">
        <figcaption>
          <strong>그림 2 관찰:</strong>
          최대 가격 35,000원은 difficulty 2.2, 2.5, 3.0, 3.1 그룹에 포함되어 있고, difficulty 3.0은 평균 30,000원과 중앙값 28,000원으로 달랐다.
        </figcaption>
      </figure>

      <dl class="evidence-notes">
        <dt>한계</dt>
        <dd>공개 목록 페이지에서 확인 가능한 30행만 수집했고, price와 difficulty가 비어 있는 2행을 제거해 28개를 분석했다.</dd>
        <dt>출처</dt>
        <dd>방도장 공개 목록 · 2026-09-28 수집 · 원본 30개 / 분석 28개</dd>
      </dl>
    </section>
  </main>

  <script>
    // data.json 의 difficulty 는 모두 소수 한 자리(예: 3.0, 3.5).
    // JS 는 3.0 을 3 으로 읽으므로, 정수일 때만 ".0" 을 붙여 원래 모양대로 보여준다.
    function formatDifficulty(v) {
      return Number.isInteger(v) ? v.toFixed(1) : String(v);
    }

    // AI 가 추천한(그리고 검증을 통과한) 테마 이름. 없으면 null
    let recommendedName = null;

    function makeCard(item) {
      const li = document.createElement("li");
      li.className = "card";
      if (item.name === recommendedName) {
        li.classList.add("is-pick");
        const badge = document.createElement("span");
        badge.className = "pick-badge";
        badge.textContent = "추천";
        li.append(badge);
      }

      const name = document.createElement("h2");
      name.textContent = item.name;

      const price = document.createElement("p");
      price.className = "meta";
      price.textContent = "가격 " + item.price;

      const difficulty = document.createElement("p");
      difficulty.className = "meta";
      difficulty.textContent = "난이도 " + formatDifficulty(item.difficulty);

      const link = document.createElement("a");
      link.href = item.detail_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "원래 화면 보기";

      li.append(name, price, difficulty, link);
      return li;
    }

    fetch("data/data.json")
      .then((res) => {
        if (!res.ok) throw new Error("data.json 을 불러오지 못했습니다 (" + res.status + ")");
        return res.json();
      })
      .then((items) => {
        const count = document.getElementById("count");
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        const budgetError = document.getElementById("budget-error");

        // 지금 화면에 보이는 카드들. 원본 items 는 건드리지 않는다.
        let current = items.slice();

        function render(shown) {
          current = shown;
          count.textContent = "조건에 맞는 " + shown.length + "개 / 전체 " + items.length + "개";
          list.replaceChildren(...shown.map(makeCard));
          list.hidden = shown.length === 0;
        }

        // 화면에서만 순서를 바꾼다. 원본 items 는 건드리지 않고 복사본을 정렬한다.
        function renderSorted(direction) {
          const sorted = current.slice().sort((a, b) => direction * (Number(a.price) - Number(b.price)));
          render(sorted);
          showSortState(direction);
        }

        // 지금 화면이 어떤 순서인지 단추(aria-pressed)와 글자로 보여준다. 0 = data.json 순서
        function showSortState(direction) {
          document.getElementById("sort-asc").setAttribute("aria-pressed", String(direction === 1));
          document.getElementById("sort-desc").setAttribute("aria-pressed", String(direction === -1));
          document.getElementById("sort-state").textContent =
            "지금: " + (direction === 1 ? "가격 낮은 순" : direction === -1 ? "가격 높은 순" : "data.json 순서");
        }
        document.getElementById("sort-asc").addEventListener("click", () => renderSorted(1));
        document.getElementById("sort-desc").addEventListener("click", () => renderSorted(-1));

        // 칸이 비어 있으면 null (= 그 조건은 걸지 않음)
        function readNumber(id) {
          const raw = document.getElementById(id).value.trim();
          return raw === "" ? null : Number(raw);
        }
        const withinBudget = (item, maxPrice) => maxPrice === null || Number(item.price) <= maxPrice;
        const hardEnough = (item, minDiff) => minDiff === null || Number(item.difficulty) >= minDiff;
        const byPrice = (a, b) => Number(a.price) - Number(b.price);

        // 맞는 카드가 없을 때: 조건은 그대로 두고, 한 조건만 풀면 어떻게 되는지 data.json 으로 계산해 알려준다.
        function emptyMessage(maxPrice, minDiff) {
          let budgetPart;
          const byDiffOnly = items.filter((it) => hardEnough(it, minDiff)).sort(byPrice);
          if (byDiffOnly.length === 0) {
            budgetPart = "난이도 " + formatDifficulty(minDiff) + " 이상인 테마는 예산을 올려도 없고";
          } else {
            const c = byDiffOnly[0];
            budgetPart = "예산만 올리면 가장 싼 후보는 " + c.name + "(가격 " + c.price + ")이고";
          }

          let diffPart;
          const byBudgetOnly = items.filter((it) => withinBudget(it, maxPrice));
          if (byBudgetOnly.length === 0) {
            diffPart = "최소 난이도를 낮춰도 가격 " + maxPrice + " 이하인 테마는 없습니다.";
          } else {
            // 예산 안에 있는 테마 중 가장 높은 난이도까지만 낮추면 결과가 생긴다.
            const newMin = Math.max(...byBudgetOnly.map((it) => Number(it.difficulty)));
            const n = byBudgetOnly.filter((it) => Number(it.difficulty) >= newMin).length;
            diffPart = "최소 난이도만 " + formatDifficulty(newMin) + "(으)로 낮추면 " + n + "개가 됩니다.";
          }

          return "조건에 맞는 테마가 없습니다. " + budgetPart + ", " + diffPart;
        }

        function applyFilter() {
          // 조건이 바뀌면 이전 추천은 맞지 않으므로 지운다.
          clearRecommendation();
          const maxPrice = readNumber("max-price");
          const minDiff = readNumber("min-difficulty");

          // 예산이 0 이하이면 거르지 않고 안내만 보여준다. (빈칸은 조건 없음이라 통과)
          const budgetInvalid = maxPrice !== null && maxPrice <= 0;
          budgetError.hidden = !budgetInvalid;
          if (budgetInvalid) return null;

          const matched = items
            .filter((it) => withinBudget(it, maxPrice) && hardEnough(it, minDiff))
            .sort(byPrice);
          render(matched);
          showSortState(1); // 필터 결과는 항상 price 낮은 순
          empty.hidden = matched.length > 0;
          empty.textContent = matched.length > 0 ? "" : emptyMessage(maxPrice, minDiff);
          return matched;
        }

        document.getElementById("apply").addEventListener("click", applyFilter);
        // 칸 값이 바뀌면 [적용] 을 누르지 않아도 바로 다시 거른다.
        document.getElementById("max-price").addEventListener("input", applyFilter);
        document.getElementById("min-difficulty").addEventListener("input", applyFilter);

        // ---- AI 추천 ----
        // 키는 브라우저에 없다. 조건만 /api/recommend (Vercel 서버 함수) 로 보내고,
        // 서버가 data.json 으로 후보를 다시 만들어 Gemini 를 부른다.
        const recommendBtn = document.getElementById("recommend-btn");
        const recommendBox = document.getElementById("recommend-result");
        const RECOMMEND_LABEL = recommendBtn.textContent;
        let requestSeq = 0; // 기다리는 사이 조건이 바뀌면 늦게 온 답은 버린다.

        // 서버와 같은 고정 순서: price 낮은 순 → difficulty 높은 순 → name 코드 순, 최대 5개
        function topCandidates(matched) {
          return matched.slice().sort((a, b) => Number(a.price) - Number(b.price)
            || Number(b.difficulty) - Number(a.difficulty)
            || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)).slice(0, 5);
        }

        function clearRecommendation() {
          requestSeq++;
          recommendBox.hidden = true;
          recommendBox.replaceChildren();
          if (recommendedName !== null) {
            recommendedName = null;
            render(current);
          }
        }

        function showRecommendMessage(text) {
          const p = document.createElement("p");
          p.textContent = text;
          recommendBox.replaceChildren(p);
          recommendBox.hidden = false;
        }

        function showRecommendation(name, reasons) {
          const title = document.createElement("p");
          title.className = "pick-name";
          title.textContent = "추천: " + name;
          const lines = reasons.map((r) => {
            const p = document.createElement("p");
            p.textContent = r;
            return p;
          });
          recommendBox.replaceChildren(title, ...lines);
          recommendBox.hidden = false;
          recommendedName = name;
          render(current); // 추천 카드에 표시
        }

        recommendBtn.addEventListener("click", async () => {
          const matched = applyFilter();
          if (matched === null) return; // 예산 0 이하: 안내만 보여주고 Gemini 를 부르지 않음
          if (matched.length === 0) return; // 후보 0개: Gemini 를 부르지 않고 M10 안내만

          const allowedNames = topCandidates(matched).map((it) => it.name);
          const seq = ++requestSeq;
          recommendBtn.disabled = true;
          recommendBtn.textContent = "고르는 중…";
          try {
            const res = await fetch("/api/recommend", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                maxPrice: readNumber("max-price"),
                minDifficulty: readNumber("min-difficulty"),
              }),
            });
            const data = await res.json().catch(() => null);
            if (seq !== requestSeq) return;

            if (!res.ok || !data || data.reason === "ai_unavailable") {
              showRecommendMessage("잠시 뒤 다시 눌러 주세요");
            } else if (data.ok && allowedNames.includes(data.name)
                       && Array.isArray(data.reasons) && data.reasons.length === 2) {
              showRecommendation(data.name, data.reasons);
            } else {
              showRecommendMessage("추천을 확인하지 못했습니다");
            }
          } catch {
            if (seq === requestSeq) showRecommendMessage("잠시 뒤 다시 눌러 주세요");
          } finally {
            recommendBtn.disabled = false;
            recommendBtn.textContent = RECOMMEND_LABEL;
          }
        });

        render(current);
      })
      .catch((err) => {
        document.getElementById("count").textContent = "";
        const box = document.getElementById("error");
        box.textContent = err.message;
        box.hidden = false;
      });
  </script>
</body>
</html>
